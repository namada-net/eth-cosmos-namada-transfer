<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WETH Transfer between Ethereum and Namada (PoC)</title>
  </head>
  <body>
    <h1>Ethereum → Cosmos Hub → Namada</h1>
    <div>
      <label>Amount (WETH, 18 decimals):</label><br/>
      <input id="amount" value="0.0001" />
    </div>
    <div>
      <button id="deposit">Deposit: Ethereum to Namada via Cosmos Hub</button>
    </div>
    <h1>Namada → Cosmos Hub → Ethereum</h1>
    <div>
      <label>Amount (WETH, 18 decimals):</label><br/>
      <input id="amount_namada" value="0.0001" />
    </div>
    <div>
      <button id="withdraw">Withdraw: Namada to Ethereum via Cosmos Hub</button>
    </div>
    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
